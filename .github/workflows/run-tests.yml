name: Tests

on:
  workflow_call:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'readme.txt'
      - 'bin/install-wp-tests.sh'
      - 'phpunit.xml.dist'
      - '.github/workflows/run-tests.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.3', '8.4', '8.5']
        wordpress: ['7.1.4']
        include:
          - os: ubuntu-latest
            php: '8.3'
            wordpress: '6.2.0'

    name: PHP ${{ matrix.php }} - WordPress ${{ matrix.wordpress }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom
          coverage: none
          tools: composer:latest

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check platform and security requirements
        run: |
          composer check-platform-reqs
          composer audit

      - name: Install WordPress test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion default-mysql-client

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}

      - name: Execute tests
        run: vendor/bin/phpunit

      - name: Verify production-only plugin on initialized WordPress
        run: |
          composer install -o --no-dev --no-interaction --prefer-dist
          composer check-platform-reqs --no-dev
          php tests/distribution.php

      - name: Verify production client without native ctype
        run: |
          sudo phpdismod -s cli ctype
          php -r 'if (extension_loaded("ctype")) { throw new RuntimeException("Native ctype is still enabled."); }'
          composer check-platform-reqs --no-dev
          php tests/distribution.php
